<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<title>Conflict ― 層塔の戦線</title>
<style>
:root{--bg:#0b1017;--panel:rgba(12,18,26,.92);--line:rgba(255,255,255,.16);--acc:#ffc94d;--blue:#4da3ff;--red:#ff5d4d;--green:#59c76d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070a0e;color:#e8eef5;overflow:hidden;
 font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP","Noto Sans SC","Hiragino Sans",sans-serif;
 -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;display:block;z-index:1}
button{font:inherit;color:#e8eef5;background:rgba(22,32,46,.9);border:1px solid var(--line);border-radius:10px;
 padding:7px 12px;min-height:38px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
button.on{background:#20507f;border-color:var(--blue)}
button.gold{background:#6b5210;border-color:var(--acc)}
button.sm{min-height:30px;padding:3px 8px;font-size:12px;border-radius:8px}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:7px;align-items:center;padding:6px 8px;
 background:linear-gradient(rgba(5,9,14,.85),rgba(5,9,14,0));pointer-events:none;font-size:13px;flex-wrap:wrap}
#bar .s{background:rgba(10,16,24,.75);border:1px solid var(--line);border-radius:9px;padding:4px 9px;white-space:nowrap;display:flex;gap:6px;align-items:center}
#bar .s b{color:var(--acc)}
#bar button,#bar .btnlike{pointer-events:auto}
#goalpill{border-color:var(--green);color:#c9f0d2}
#alert{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);z-index:8;color:#ff8d7a;
 font-size:min(5vw,26px);font-weight:800;letter-spacing:2px;text-shadow:0 2px 10px #000;display:none;pointer-events:none}
#toasts{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(10,16,24,.93);border:1px solid var(--line);padding:6px 14px;border-radius:10px;font-size:13px}
#panel{position:fixed;right:8px;bottom:8px;z-index:6;width:min(52vw,440px);max-height:46vh;overflow-y:auto;
 background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:none;
 flex-wrap:wrap;gap:6px;align-content:flex-start;-webkit-overflow-scrolling:touch}
#panel.show{display:flex}
#panel .selinfo{width:100%;font-size:12px;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.badge{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(34,50,70,.95);
 display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;position:relative}
.badge i{position:absolute;bottom:2px;right:3px;font-size:9px;font-style:normal;opacity:.8}
.chip{display:flex;align-items:center;gap:6px;background:rgba(30,44,62,.95);border:1px solid var(--line);
 border-radius:9px;padding:5px 9px;min-height:38px;cursor:pointer;font-size:13px}
.chip.dis{opacity:.4}
.chip .key{width:18px;height:18px;border-radius:5px;background:#0d1620;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.chip .cst{color:var(--acc);font-size:11px}
.chip.q{cursor:default;background:rgba(16,24,34,.9)}
.hr{width:100%;height:1px;background:var(--line)}
.screen{position:fixed;inset:0;z-index:20;display:none;background:radial-gradient(1100px 640px at 50% 38%,#1a2836,#070a0e 72%);
 overflow-y:auto;padding:20px 16px;-webkit-overflow-scrolling:touch}
.screen.show{display:block}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:min(9vw,44px);margin:8px 0 2px;letter-spacing:3px;text-align:center;color:#fff}
h1 span{color:var(--acc)}
.sub{text-align:center;opacity:.75;margin:0 0 14px;font-size:min(4vw,15px)}
h2{font-size:16px;margin:16px 0 8px;border-left:4px solid var(--acc);padding-left:8px}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mrow button{min-height:44px;font-size:15px;padding:9px 18px}
#stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-top:8px}
.stagecard{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:rgba(17,26,37,.9);cursor:pointer;position:relative}
.stagecard:active{transform:scale(.98)}
.stagecard .no{font-size:10px;opacity:.55;letter-spacing:1px}
.stagecard .nm{font-weight:700;margin:3px 0 5px;font-size:14px}
.stagecard .st{font-size:13px;letter-spacing:3px;color:var(--acc);min-height:16px}
.stagecard .bk{font-size:11px;opacity:.6;min-height:14px}
.stagecard .gt{font-size:10px;opacity:.5;position:absolute;top:9px;right:10px}
.stagecard.locked{opacity:.35;cursor:default}
.stagecard.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.helpbox{font-size:13px;line-height:1.65;opacity:.92}
.helpbox kbd{background:#101a24;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}
.kv{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0;font-size:13px}
#resmask{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(4,7,11,.72)}
#resmask.show{display:flex}
#rescard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;min-width:min(92vw,400px);text-align:center}
#rTitle{font-size:26px;margin:0 0 6px;letter-spacing:3px}
#rStars{font-size:34px;letter-spacing:6px;color:var(--acc);margin:6px 0}
#rStats{font-size:13px;opacity:.85;margin:10px 0;line-height:1.7}
#rotate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#070a0e;text-align:center;font-size:15px;line-height:1.8;padding:20px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
body:not(.ingame) #cv{visibility:hidden}
body:not(.ingame) #bar,body:not(.ingame) #alert,body:not(.ingame) #panel{display:none}
button.chip{display:inline-flex;align-items:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
 <button id="bMenu" class="sm">☰</button>
 <div class="s">💰<b id="hGold">0</b></div>
 <div class="s" id="sPop">👥 <span id="hPop">0/0</span></div>
 <div class="s" id="sArmy">⚔ <span id="hArmy">0</span></div>
 <div class="s">⏱ <span id="hTime">0:00</span></div>
 <div class="s" id="goalpill"></div>
 <span style="flex:1"></span>
 <button id="bSp1" class="sm on">1×</button>
 <button id="bSp2" class="sm">2×</button>
 <button id="bPause" class="sm">⏸</button>
 <button id="bSound" class="sm">🔊</button>
 <button id="bLang" class="sm">日本語</button>
</div>
<div id="alert"></div>
<div id="panel"></div>
<div id="toasts"></div>

<div class="screen show" id="scrTitle">
 <div class="wrap" style="padding-top:6vh">
  <h1>Con<span>fli</span>ct</h1>
  <p class="sub" id="tSub"></p>
  <div class="mrow"><button id="btnStart" class="gold"></button></div>
  <div class="mrow"><button id="btnHelp"></button></div>
  <div class="kv">
    <span id="tDiffL"></span>
    <button id="dEasy" class="sm"></button><button id="dNormal" class="sm"></button><button id="dHard" class="sm"></button>
  </div>
  <div class="kv">
    <span id="tSndL"></span>
    <button id="tSndOn" class="sm"></button><button id="tSndOff" class="sm"></button>
  </div>
  <div class="kv">
    <span id="tLangL"></span>
    <button class="sm" data-lang="ja">日本語</button><button class="sm" data-lang="en">English</button><button class="sm" data-lang="cn">简体中文</button><button class="sm" data-lang="tw">繁體中文</button>
  </div>
  <p style="text-align:center;opacity:.45;font-size:11px" id="tVer"></p>
 </div>
</div>

<div class="screen" id="scrStages">
 <div class="wrap">
  <h1 style="font-size:min(6vw,26px)">ST<span>RA</span>TA</h1>
  <div class="mrow">
   <button id="btnBack" class="sm"></button><button id="btnHelp2" class="sm"></button>
   <button id="bSound2" class="sm">🔊</button><button id="bLang2" class="sm"></button>
  </div>
  <h2 id="tStages"></h2>
  <div id="stages"></div>
  <div class="mrow" style="margin-top:14px"><button id="btnReset" class="sm"></button></div>
 </div>
</div>

<div class="screen" id="scrHelp">
 <div class="wrap">
  <h2 id="hTitle"></h2>
  <div class="helpbox" id="hBody"></div>
  <div class="mrow"><button id="btnHelpBack" class="gold"></button></div>
 </div>
</div>

<div id="resmask">
 <div id="rescard">
  <h2 id="rStage"></h2>
  <div id="rTitle"></div>
  <div id="rStars"></div>
  <div id="rStats"></div>
  <div class="mrow"><button id="rNext" class="gold"></button></div>
  <div class="mrow"><button id="rRetry" class="sm"></button><button id="rStages" class="sm"></button></div>
 </div>
</div>

<div class="screen" id="scrPause">
 <div class="wrap" style="max-width:420px;padding-top:6vh">
  <h2 id="pTitle" style="text-align:center;border:none"></h2>
  <div class="mrow"><button id="btnResume" class="gold"></button></div>
  <div class="mrow"><button id="btnRestart" class="sm"></button><button id="btnQuit" class="sm"></button></div>
  <div class="kv"><span id="tSndL2"></span><button id="pSndOn" class="sm"></button><button id="pSndOff" class="sm"></button></div>
  <div class="kv"><span id="tLangL2"></span><button class="sm" data-lang="ja">日本語</button><button class="sm" data-lang="en">English</button><button class="sm" data-lang="cn">简体中文</button><button class="sm" data-lang="tw">繁體中文</button></div>
 </div>
</div>

<div id="rotate"></div>

/* ================= selection & orders ================= */
function selSameType(G,type){ G.sel=G.units.filter(u=>u.team===0&&u.type===type); updatePanel(); }
function selWorkers(G){ G.sel=G.units.filter(u=>u.team===0&&u.type==='worker'); updatePanel(); }
function milSel(G){ return G.sel.filter(u=>u.kind==='unit'&&U[u.type]&&U[u.type].military); }
function workSel(G){ return G.sel.filter(u=>u.kind==='unit'&&u.type==='worker'); }
function hoverEnt(wx,wy){
 let best=null,bd=1e18;
 for(const u of G.units){ const d=distP(u.x,u.y,wx,wy); if(d<11+(U[u.type].rad||9)&&d<bd){ bd=d; best=u; } }
 if(best) return best;
 for(const b of G.buildings){ if(Math.abs(wx-b.x)<b.w/2+6&&Math.abs(wy-b.y)<b.h/2+6) return b; }
 for(const m of G.mines){ if(distP(m.x,m.y,wx,wy)<28) return {kind:'mine',m}; }
 return null;
}
function issueCommand(wx,wy){
 const ms=milSel(G),ws=workSel(G);
 if(G.rallyFlag){ const b=G.sel.find(e=>e.kind==='build'); if(b){ b.rallyx=wx; b.rallyy=wy; } G.rallyFlag=null; snd('click'); return true; }
 if(G.holdT){ for(const u of ms) u.stance='aggro'; G.holdT=false; snd('click'); updatePanel(); return true; }
 if(G.atkT){ for(const u of ms) { u.mode='attack'; u.mv={x:wx,y:wy}; u.ftgt=null; } G.atkT=false; snd('tap'); return true; }
 const all=ms.concat(ws);
 if(!all.length) return false;
 for(const u of ms){ u.mode='attack'; u.mv={x:wx,y:wy}; u.ftgt=null; u.home={x:wx,y:wy}; }
 for(const u of ws){ u.mode='walk'; u.mv={x:wx,y:wy}; u.st=null; u.repr=null; u.gs=null; u.ftgt=null; }
 snd('tap'); return true;
}
function doTap(wx,wy){
 const tgt=hoverEnt(wx,wy);
 if(G.placeT){ G.gx=wx; G.gy=wy; const tp=G.placeT; G.placeT=0; if(!G.placePlayer(tp,wx,wy)) G.placeT=tp; return; }
 if(tgt&&tgt.kind==='mine'){ if(issueCommand(wx,wy)) return; for(const u of workSel(G)){ u.mode='gather'; u.gs='tomine'; u.mine=tgt.m; u.st=null; u.repr=null; } if(workSel(G).length){ snd('tap'); return; } G.sel=[]; updatePanel(); return; }
 if(tgt&&tgt.kind==='unit'){
  if(tgt.team===0){
   const now=performance.now();
   if(G.lastTap.id===tgt.id&&now-G.lastTap.tm<420) selSameType(G,tgt.type);
   else { G.sel=[tgt]; G.lastTap={id:tgt.id,tm:now}; updatePanel(); }
   snd('click'); return;
  }
  const ms=milSel(G);
  if(ms.length){ G.orderAttack(ms,tgt); return; }
  const ws=workSel(G);
  if(ws.length){ G.orderAttack(ws,tgt); return; }
  G.sel=[]; updatePanel(); return;
 }
 if(tgt&&tgt.kind==='build'){
  if(tgt.team===0){
   const ws=workSel(G),ms=milSel(G);
   if(ws.length&&!ms.length&&tgt.isbuilding){ for(const u of ws){ u.mode='build'; u.st={b:tgt}; u.gs=null; u.repr=null; } snd('tap'); return; }
   if(ws.length&&!ms.length&&tgt.hp<tgt.maxhp){ for(const u of ws){ u.mode='repair'; u.repr=tgt; u.gs=null; } snd('tap'); return; }
   G.sel=[tgt]; updatePanel(); snd('click'); return;
  }
  const ms=milSel(G),ws=workSel(G);
  if(ms.length){ G.orderAttack(ms,tgt); return; }
  if(ws.length){ for(const u of ws){ u.mode='attack'; u.mv=null; u.ftgt=tgt; } snd('tap'); return; }
  if(issueCommand(wx,wy)) return;
  G.sel=[]; updatePanel(); return;
 }
 if(tgt&&tgt.mine){ if(issueCommand(wx,wy)) return; G.sel=[]; updatePanel(); return; }
 if(issueCommand(wx,wy)) return;
 G.sel=[]; updatePanel();
}
function doRight(wx,wy){
 if(!G||G.over) return;
 const tgt=hoverEnt(wx,wy);
 const ms=milSel(G),ws=workSel(G);
 if(tgt&&(tgt.kind==='unit'&&tgt.team!==0||tgt.kind==='build'&&tgt.team!==0)){ if(ms.length) G.orderAttack(ms,tgt); else if(ws.length) G.orderAttack(ws,tgt); return; }
 if(tgt&&tgt.mine){ for(const u of ws){ u.mode='gather'; u.gs='tomine'; u.mine=tgt.m; } if(ws.length) snd('tap'); return; }
 if(tgt&&tgt.kind==='build'&&tgt.team===0&&ws.length){ for(const u of ws){ if(tgt.isbuilding){ u.mode='build'; u.st={b:tgt}; } else if(tgt.hp<tgt.maxhp){ u.mode='repair'; u.repr=tgt; } } return; }
 if(ms.length) G.order(ms,wx,wy,false);
 if(ws.length) G.order(ws,wx,wy,false);
 if(ms.length||ws.length) snd('tap');
}

  G.mp={x:sx,y:sy,dx:0,dy:0,moved:false};
 } else {

 const px=p.x,py=p.y; p.x=e.clientX; p.y=e.clientY;
 if(ptrs.size>=2){ const a=[...ptrs.values()]; const d=distP(a[0].x,a[0].y,a[1].x,a[1].y); if(pinchBase>20){ G.zoom=clamp(pinchZoom*d/pinchBase,0.6,1.6); G.setCam(G.cam.x+G.vw/2/G.zoom,G.cam.y+G.vh/2/G.zoom); } return; }
 if(G.mmDrag){ const w=toW((e.clientX-G.mm.x)*G.W/G.mm.w,(e.clientY-G.mm.y)*G.H/G.mm.h); G.setCam(w.x,w.y); return; }
 if(G.pan&&G.pan.id===e.pointerId){ G.setCam(G.cam.x+G.vw/2/G.zoom-(e.clientX-px)/G.zoom,G.cam.y+G.vh/2/G.zoom-(e.clientY-py)/G.zoom); return; }
 if(G.tp&&G.tp.id===e.pointerId){
  if(!G.tp.moved&&distP(e.clientX,e.clientY,G.tp.x,G.tp.y)>11) G.tp.moved=true;
  if(G.tp.moved) G.setCam(G.cam.x+G.vw/2/G.zoom-(e.clientX-px)/G.zoom,G.cam.y+G.vh/2/G.zoom-(e.clientY-py)/G.zoom);
  return;
 }
 if(G.mp){
  const d=distP(e.clientX,e.clientY,G.mp.x,G.mp.y);
  if(!G.mp.moved&&d>7) G.mp.moved=true;
  if(G.mp.moved){ G.box={x0:G.mp.x,y0:G.mp.y,x1:e.clientX,y1:e.clientY}; }
  return;
 }
 if(G.placeT&&e.pointerType==='touch'){ const w=toW(e.clientX,e.clientY); G.gx=w.x; G.gy=w.y; }
});
function endPtr(e){
 if(!G) return;
 ptrs.delete(e.pointerId);
 if(ptrs.size<2) pinchBase=0;
 if(G.mmDrag){ G.mmDrag=false; return; }
 if(G.pan&&G.pan.id===e.pointerId){ G.pan=null; return; }
 if(G.tp&&G.tp.id===e.pointerId){
  const tp=G.tp; G.tp=null;
  if(!tp.moved&&performance.now()-tp.t<650){ const w=toW(e.clientX,e.clientY); doTap(w.x,w.y); }
  return;
 }
 if(G.mp){
  const mp=G.mp; G.mp=null;
  if(mp.moved&&G.box){
   const a=Math.min(mp.x,G.box.x1)/G.zoom,b=Math.max(mp.x,G.box.x1)/G.zoom,c=Math.min(mp.y,G.box.y1)/G.zoom,d2=Math.max(mp.y,G.box.y1)/G.zoom;
   const x0=G.cam.x+a,y0=G.cam.y+c,x1=G.cam.x+b,y1=G.cam.y+d2;
   G.sel=G.units.filter(u=>u.team===0&&u.x>=x0&&u.x<=x1&&u.y>=y0&&u.y<=y1).slice(0,60);
   G.box=null; updatePanel(); snd('click');
  } else { const w=toW(e.clientX,e.clientY); doTap(w.x,w.y); }
 }
}
window.addEventListener('pointerup',endPtr);
window.addEventListener('pointercancel',endPtr);
const keys=new Set();
window.addEventListener('keydown',e=>{
 if(!G||e.target.tagName==='INPUT') return;
 const k=e.key;
 if(k==='Escape'){
  if(G.placeT){ G.placeT=0; updatePanel(); }
  else if(G.rallyFlag||G.holdT||G.atkT){ G.rallyFlag=null; G.holdT=false; G.atkT=false; }
  else if(G.sel.length){ G.sel=[]; updatePanel(); }
  else openPause();
  return;
 }
 if(e.repeat) return;
 if(k===' '){ G.paused=!G.paused; updateHud(); e.preventDefault(); return; }
 keys.add(k.toLowerCase());
 if(k==='1'){ G.speed=1; G.paused=false; spdUI(); }
 else if(k==='2'){ G.speed=2; G.paused=false; spdUI(); }
 else if(k==='3'){ G.speed=3; G.paused=false; spdUI(); }
 else if(k==='f1'){ selWorkers(G); e.preventDefault(); }
 else if(k==='h') G.setStance(G.sel,'aggro');
 else if(k==='g') G.setStance(G.sel,'defend');
 else if(k==='s') G.orderStop(G.sel);
 else if(k==='a'){ G.atkT=true; toast('⚔'); }
 else if(k.toLowerCase()==='q') trainHot(0);
 else if(k.toLowerCase()==='w') trainHot(1);
 else if(k.toLowerCase()==='e') trainHot(2);
 else if(k.toLowerCase()==='r') trainHot(3);
 else if(k.toLowerCase()==='b') placeHot('farm');
 else if(k.toLowerCase()==='v') placeHot('barracks');
 else if(k.toLowerCase()==='n') placeHot('archery');
 else if(k.toLowerCase()==='c') placeHot('stable');
 else if(k.toLowerCase()==='t') placeHot('tower');
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('wheel',e=>{
 if(!G||!document.body.classList.contains('ingame')||G.over) return;
 const p=el('panel');
 if(p.classList.contains('show')&&e.clientX>p.offsetLeft&&e.clientX<p.offsetLeft+p.offsetWidth&&e.clientY>p.offsetTop&&e.clientY<p.offsetTop+p.offsetHeight) return;
 e.preventDefault();
 let dy=e.deltaY*(e.deltaMode===1?16:1); if(dy>400)dy=400; if(dy<-400)dy=-400;
 const z=clamp(G.zoom*(1-dy*(e.ctrlKey?0.01:0.0012)),0.6,1.6);
 const wx=G.cam.x+e.clientX/G.zoom, wy=G.cam.y+e.clientY/G.zoom;
 G.zoom=z; G.setCam(wx+(G.vw/2-e.clientX)/z,wy+(G.vh/2-e.clientY)/z);
},{passive:false});
function trainHot(i){
 const b=G.sel.find(e=>e.kind==='build'&&e.team===0&&e.done!==false);
 if(!b) return; const q=B[b.type].q; if(q&&q[i]) G.queue(b,q[i],true);
}
function placeHot(bt){
 if(!G.sel.some(e=>e.kind==='build'&&e.type==='tc'&&e.team===0)) return;
 if((G.lv.block||[]).indexOf(bt)>=0) return;
 G.placeT=bt; G.gx=G.cam.x+G.vw/2/G.zoom; G.gy=G.cam.y+G.vh/2/G.zoom; toast(t('b_'+bt));
}
el('panel').addEventListener('click',e=>{
 if(!G) return;
 const tr=e.target.closest('[data-train]');
 if(tr){ const b=G.sel.find(x=>x.kind==='build'); if(b) G.queue(b,tr.dataset.train,true); return; }
 const pl=e.target.closest('[data-place]');
 if(pl){ G.placeT=pl.dataset.place; G.gx=G.cam.x+G.vw/2/G.zoom; G.gy=G.cam.y+G.vh/2/G.zoom; toast(t('b_'+G.placeT)); return; }
 const btn=e.target.closest('[data-cmd]');
 if(!btn) return;
 const cmd=btn.dataset.cmd;
 if(cmd==='aggro') G.setStance(G.sel,'aggro');
 else if(cmd==='defend') G.setStance(G.sel,'defend');
 else if(cmd==='stop') G.orderStop(G.sel);
 else if(cmd==='selw') selWorkers(G);
 else if(cmd==='seltc'){ G.sel=G.buildings.filter(b=>b.team===0&&b.type==='tc'&&!b.dead); updatePanel(); }
 else if(cmd==='autog'){ G.autoG=!G.autoG; for(const u of G.units){ if(u.team!==0||u.type!=='worker') continue; if(!G.autoG&&u.mode==='gather'){ u.mode='idlew'; u.gs=null; } else if(G.autoG&&(u.mode==='idlew'||u.mode==='walk'&&!u.mv)) G.autoGather(u); } updatePanel(); }
 else if(cmd==='rally'){ const b=G.sel.find(x=>x.kind==='build'); if(b){ G.rallyFlag=b.id; toast('⚑'); } }
});
/* ================= menus ================= */
function spdUI(){ if(!G) return; el('bSp1').classList.toggle('on',!G.paused&&G.speed===1); el('bSp2').classList.toggle('on',!G.paused&&G.speed===2); el('bPause').textContent=G.paused?'▶':'⏸'; }
function applyLabels(){
 el('tSub').textContent=t('title_sub'); el('btnStart').textContent='▶ '+t('btn_start'); el('btnHelp').textContent='? '+t('btn_help');
 el('tDiffL').textContent=t('label_diff'); el('dEasy').textContent=t('diff_easy'); el('dNormal').textContent=t('diff_normal'); el('dHard').textContent=t('diff_hard');
 el('tSndL').textContent=t('label_snd'); el('tSndL2').textContent=t('label_snd');
 ['tSndOn','pSndOn'].forEach(id=>el(id).textContent=t('on'));
 ['tSndOff','pSndOff'].forEach(id=>el(id).textContent=t('off'));
 el('tLangL').textContent=t('label_lang'); el('tLangL2').textContent=t('label_lang');
 el('tStages').textContent=t('btn_stages');
 el('btnBack').textContent=t('btn_back'); el('btnHelp2').textContent='? '+t('btn_help');
 el('btnReset').textContent='🗑 '+t('confirm_reset');
 el('hTitle').textContent=t('help_title'); el('hBody').innerHTML=t('help_body'); el('btnHelpBack').textContent=t('help_back');
 el('pTitle').textContent='❚❚ '+t('paused');
 el('btnResume').textContent='▶ '+t('btn_continue'); el('btnRestart').textContent='↻ '+t('res_retry'); el('btnQuit').textContent='✕ '+t('res_stages');
 el('tVer').textContent='v1.0 · '+LEVELS.length+' STAGES';
 const sndTxt=SAVE.sound?'🔊':'🔈'; el('bSound').textContent=sndTxt; el('bSound2').textContent=sndTxt;
 const ln={ja:'日本語',en:'EN',cn:'简体',tw:'正體'}[SAVE.lang]; el('bLang').textContent=ln; el('bLang2').textContent=ln;
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===SAVE.lang));
 ['dEasy','dNormal','dHard'].forEach((id,i)=>el(id).classList.toggle('on',['easy','normal','hard'][i]===SAVE.diff));
 ['tSndOn','pSndOn'].forEach(id=>el(id).classList.toggle('on',SAVE.sound));
 ['tSndOff','pSndOff'].forEach(id=>el(id).classList.toggle('on',!SAVE.sound));
 if(document.getElementById('scrStages').classList.contains('show')) renderStages();
 if(G){ el('goalpill').textContent=goalText(); updatePanel(); }
}
function renderStages(){
 const box=el('stages'); box.innerHTML='';
 for(const lv of LEVELS){
  const st=SAVE.stages[lv.id]||{};
  const locked=lv.id>SAVE.unlocked;
  const d=document.createElement('div');
  d.className='stagecard'+(locked?' locked':'')+(lv.id===SAVE.unlocked?' cur':'');
  const stars=st.stars?'★★★☆☆☆☆☆'.slice(0,st.stars)+'☆☆☆'.slice(0,3-st.stars):'☆☆☆';
  const bk=st.best?t('best')+' '+fmtTime(st.best):(st.tried?t('loser'):'');
  const gt=lv.goal==='defend'?'🛡':lv.goal==='destroy'?'⏳':'⚔';
  d.innerHTML='<div class="no">'+t('stage')+' '+lv.id+'</div><div class="nm">'+(t('snames')[lv.id-1]||'')+'</div><div class="st">'+(locked?t('locked'):stars)+'</div><div class="bk">'+bk+'</div><div class="gt">'+gt+'</div>';
  if(!locked) d.addEventListener('click',()=>{ snd('click'); startGame(lv.id); });
  box.appendChild(d);
 }
}
function showResult(win,stars,sec){
 el('rStage').textContent=t('stage')+' '+G.lv.id+' · '+(t('snames')[G.lv.id-1]||'');
 el('rTitle').textContent=t(win?'res_win':'res_lose');
 el('rTitle').style.color=win?'#59c76d':'#ff5d4d';
 let sh=''; for(let i=0;i<3;i++) sh+='<span style="opacity:'+(i<stars?1:0.25)+'">★</span>';
 el('rStars').innerHTML=sh;
 let s=t('res_time')+' '+fmtTime(sec)+'  ·  '+t('res_losses')+' '+G.stats.lost[0];
 if(G.lv.par) s+='<br>'+t('par')+' ≤'+fmtTime(G.lv.par)+' · '+t('loselim')+' ≤'+G.lv.loselimit;
 el('rStats').innerHTML=s;
 el('rNext').style.display=(win&&G.lv.id<LEVELS.length&&G.lv.id<SAVE.unlocked)?'':'none';
 el('resmask').classList.add('show');
 snd(win?'win':'lose');
 toast(t('saved'));
}
function openPause(){ if(!G||G.over) return; G.paused=true; showScreen('scrPause'); spdUI(); }
function startGame(id){
 G=new Game(id); G.cv=cv; G.ctx=ctx; resize();
 G.onEnd=showResult;
 showScreen(null); updateHud(); spdUI(); updatePanel();
 if(!SAVE.hints){ SAVE.hints=true; saveNow(); setTimeout(()=>toast(t('hint1')),1200); setTimeout(()=>toast(t('hint2')),3600); setTimeout(()=>toast(t('hint3')),6000); }
}
function resize(){
 const w=window.innerWidth,h=window.innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
 cv.style.width=w+'px'; cv.style.height=h+'px';
 if(G){ const cx=G.cam.x+G.vw/2/G.zoom,cy=G.cam.y+G.vh/2/G.zoom; G.vw=w; G.vh=h; G.setCam(cx,cy); }
}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G&&!G.over&&!G.paused){ G.paused=true; spdUI(); } });
/* buttons */
el('btnStart').addEventListener('click',()=>{ snd('click'); renderStages(); showScreen('scrStages'); });
el('btnBack').addEventListener('click',()=>{ showScreen('scrTitle'); });
el('btnHelp').addEventListener('click',()=>{ snd('click'); showScreen('scrHelp'); });
el('btnHelp2').addEventListener('click',()=>{ showScreen('scrHelp'); });
el('btnHelpBack').addEventListener('click',()=>{ renderStages(); showScreen('scrStages'); });
el('btnReset').addEventListener('click',()=>{ if(confirm(t('confirm_reset'))){ try{localStorage.removeItem('Conflict_save_v1');}catch(e){} SAVE=loadSave(); applyLabels(); renderStages(); } });
function setLang(l){ SAVE.lang=l; try{document.documentElement.lang=l;}catch(e){} saveNow(); applyLabels(); if(G){ el('goalpill').textContent=goalText(); } renderStages(); }
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
function cycleLang(){ const o=['ja','en','cn','tw']; setLang(o[(o.indexOf(SAVE.lang)+1)%4]); }
el('bLang').addEventListener('click',cycleLang); el('bLang2').addEventListener('click',cycleLang);
function setSnd(v){ SAVE.sound=v; saveNow(); applyLabels(); if(v){ snd('click'); ac(); } }
el('tSndOn').addEventListener('click',()=>setSnd(true)); el('tSndOff').addEventListener('click',()=>setSnd(false));
el('pSndOn').addEventListener('click',()=>setSnd(true)); el('pSndOff').addEventListener('click',()=>setSnd(false));
function sSnd(){ setSnd(!SAVE.sound); }
el('bSound').addEventListener('click',sSnd); el('bSound2').addEventListener('click',sSnd);
function setDiff(d){ SAVE.diff=d; saveNow(); applyLabels(); }
el('dEasy').addEventListener('click',()=>setDiff('easy')); el('dNormal').addEventListener('click',()=>setDiff('normal')); el('dHard').addEventListener('click',()=>setDiff('hard'));
el('bMenu').addEventListener('click',openPause);
el('btnResume').addEventListener('click',()=>{ showScreen(null); if(G) G.paused=false; spdUI(); });
el('btnRestart').addEventListener('click',()=>{ const id=G.lv.id; startGame(id); });
el('btnQuit').addEventListener('click',()=>{ G=null; renderStages(); showScreen('scrStages'); });
el('rNext').addEventListener('click',()=>{ const id=G.lv.id+1; startGame(id); });
el('rRetry').addEventListener('click',()=>{ startGame(G.lv.id); });
el('rStages').addEventListener('click',()=>{ G=null; renderStages(); showScreen('scrStages'); });
el('bPause').addEventListener('click',()=>{ if(G&&!G.over){ G.paused=!G.paused; spdUI(); } });
el('bSp1').addEventListener('click',()=>{ if(G){ G.speed=1; G.paused=false; spdUI(); } });
el('bSp2').addEventListener('click',()=>{ if(G){ G.speed=2; G.paused=false; spdUI(); } });
/* ================= loop ================= */
let lastT=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 let rdt=(now-lastT)/1000; lastT=now; if(rdt>0.25) rdt=0.25;
 if(!G) return;
 if(!G.paused&&!G.over){
  G.acc+=rdt*G.speed; let it=0;
  while(G.acc>1/30&&it<6){ G.step(1/30); G.acc-=1/30; it++; }
 }
 const pv=(keys.has('arrowdown')?1:0)-(keys.has('arrowup')?1:0), ph=(keys.has('arrowright')?1:0)-(keys.has('arrowleft')?1:0);
 if(pv||ph) G.setCam(G.cam.x+G.vw/2/G.zoom+ph*300*rdt/G.zoom,G.cam.y+G.vh/2/G.zoom+pv*300*rdt/G.zoom);
 G.render();
 G.hudT-=rdt; if(G.hudT<=0){ G.hudT=0.25; updateHud(); }
 G.pnlT-=rdt; if(G.pnlT<=0){ G.pnlT=0.45; if(G.sel.length) updatePanel(); }
 if(G.alertT>0){ G.alertT-=rdt; el('alert').style.display='block'; el('alert').textContent=t('alert'); }
 else el('alert').style.display='none';
}
resize();
applyLabels();
requestAnimationFrame(frame);
window.__test={Game,LEVELS,U,B,save:()=>SAVE,setSave:s=>{SAVE=s;},t,getG:()=>G};
</script>
